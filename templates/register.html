<!-- register.html -->

<!DOCTYPE html>
<html>
<head>
    <title>{{ _('Register') }}</title>
</head>
<body>
    <h2>{{ _('Register') }}</h2>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="POST" action="/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
            <label for="username">{{ _('Username') }}:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="firstname">{{ _('First Name') }}:</label>
            <input type="text" id="firstname" name="firstname" required>
        </div>
        <div>
            <label for="lastname">{{ _('Last Name') }}:</label>
            <input type="text" id="lastname" name="lastname" required>
        </div>
        <div>
            <label for="role">{{ _('Role') }}:</label>
            <select id="role" name="role">
                {% for role in roles %}
                    <option value="{{ role.role_id }}">{{ role.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="team">{{ _('Department') }}:</label>
            <select id="team" name="team" required>
                {% for team in teams %}
                    <option value="{{ team.team_id }}">{{ team.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="email">{{ _('Email') }}:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="phone">{{ _('Phone Number') }}:</label>
            <input type="text" id="phone" name="phone" required>
        </div>
        <div>
            <button type="submit">{{ _('Register') }}</button>
        </div>
    </form>
    <footer style="position: fixed; left: 0; right: 0; bottom: 0; padding: 0.5rem 0; background: rgba(255,255,255,0.95); text-align: center; font-size: 0.8rem; color: #6c757d; border-top: 1px solid #e3e6f0;">
        <div>{{ _('Copyright') }} &copy; Limwris 2023</div>
        <div>{{ _('Version') }} {{ app_version }}</div>
    </footer>
</body>
</html>
