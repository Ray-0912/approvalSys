<!DOCTYPE html>
<html>
<head>
  <title>{{ _('Reset Password') }}</title>
</head>
<body>
  <h1>{{ _('Reset Password') }}</h1>
  <form id="resetP" method="POST" action="/resetPassword">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">{{ _('Username') }}:</label>
    <input type="text" id="username" name="username" required><br><br>
    <label for="password">{{ _('Password') }}:</label>
    <input type="password" id="password" name="password" required><br><br>
    <label for="confirm_password">{{ _('Confirm Password') }}:</label>
    <input type="password" id="confirm_password" name="confirm_password" required><br><br>
    <a
        href="#"
        onclick="document.getElementById('resetP').submit()"
        type="submit">
        <i class="fas fa-download fa-sm text-white-50"></i>
        {{ _('Submit') }}
    </a>
  </form>
  <footer style="position: fixed; left: 0; right: 0; bottom: 0; padding: 0.5rem 0; background: rgba(255,255,255,0.95); text-align: center; font-size: 0.8rem; color: #6c757d; border-top: 1px solid #e3e6f0;">
    <div>{{ _('Copyright') }} &copy; Limwris 2023</div>
    <div>{{ _('Version') }} {{ app_version }}</div>
  </footer>
</body>
</html>
